<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nautilus 工作台 · S4 瑞士制图 · 交互原型</title>
<style>
/* ================= 令牌层（--nt-*：默认值映射宿主 --dsw-alias-*，亮暗双主题） ================= */
:root{
  --nt-bg:#f2f2f0; --nt-panel:#ffffff; --nt-panel2:#f7f7f5; --nt-border:#d9d9d5; --nt-border2:#c8c8c3;
  --nt-text:#101010; --nt-dim:#5f5f5c; --nt-faint:#9a9a95;
  --nt-accent:#e6321e; --nt-ok:#1a7f37;
  --nt-ink:#101010; --nt-gray:#9a9a95;
  --nt-font:'Helvetica Neue',Helvetica,Arial,'Segoe UI','Microsoft YaHei',sans-serif;
  --nt-shadow:0 1px 2px rgba(20,20,18,.05);
}
body.dark{
  --nt-bg:#121314; --nt-panel:#1a1b1d; --nt-panel2:#232427; --nt-border:#35363a; --nt-border2:#4a4b50;
  --nt-text:#f2f2f0; --nt-dim:#a9a9a4; --nt-faint:#70706b;
  --nt-ok:#3fb950;
  --nt-ink:#f2f2f0; --nt-gray:#70706b;
  --nt-shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nt-bg);color:var(--nt-text);font:13px/1.6 var(--nt-font)}
button,input,select{font-family:inherit}
::selection{background:var(--nt-accent);color:#fff}

/* ================= 应用壳：左栏 + 主区 + 抽屉 ================= */
#app{display:flex;height:100vh;overflow:hidden}
#rail{width:60px;flex:none;background:var(--nt-panel);border-right:1px solid var(--nt-border);
  display:flex;flex-direction:column;align-items:stretch;padding-top:10px}
#rail .brand{font-weight:700;font-size:15px;letter-spacing:1px;text-align:center;padding:6px 0 14px;border-bottom:1px solid var(--nt-border);margin:0 10px 10px}
#rail nav{display:flex;flex-direction:column;gap:2px;padding:0 6px}
#rail nav button{border:none;background:none;color:var(--nt-dim);font-size:11px;padding:9px 0;cursor:pointer;
  border-left:2px solid transparent;text-align:center;letter-spacing:1px}
#rail nav button:hover{color:var(--nt-text)}
#rail nav button.on{color:var(--nt-text);border-left-color:var(--nt-accent);font-weight:700}
#rail .foot{margin-top:auto;padding:10px 0;text-align:center;font-size:9px;letter-spacing:2px;color:var(--nt-faint)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--nt-panel);
  border-bottom:1px solid var(--nt-border);flex-wrap:wrap}
.crumb{font-weight:700;letter-spacing:2.5px;font-size:14px}
.crumb small{font-weight:400;letter-spacing:.3px;color:var(--nt-faint);margin-left:8px;font-size:11px}
.crumb em{font-style:normal;color:var(--nt-faint);font-weight:400;letter-spacing:.5px;margin-left:10px;font-size:12px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--nt-border)}
.seg button{border:none;background:none;color:var(--nt-dim);font-size:11.5px;padding:4px 12px;cursor:pointer;letter-spacing:.5px}
.seg button+button{border-left:1px solid var(--nt-border)}
.seg button.on{background:var(--nt-ink);color:var(--nt-bg);font-weight:700}
.ctl-select{background:var(--nt-panel);color:var(--nt-text);border:1px solid var(--nt-border);padding:4px 8px;font-size:11.5px;border-radius:0}
.ctl-btn{background:var(--nt-panel);color:var(--nt-dim);border:1px solid var(--nt-border);padding:4px 12px;font-size:11.5px;cursor:pointer;letter-spacing:.5px}
.ctl-btn:hover{color:var(--nt-text);border-color:var(--nt-border2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--nt-border);background:var(--nt-panel);
  color:var(--nt-dim);font-size:11px;padding:4px 10px;cursor:pointer;letter-spacing:.8px}
.chip b{color:var(--nt-accent);letter-spacing:1.5px}
.chip:hover{border-color:var(--nt-border2)}
#content{flex:1;overflow:auto;padding:16px 18px 40px}
.wrap{max-width:1160px;margin:0 auto}

/* ================= 面板体系（Grafana 式栅格 × Swiss 图纸语言） ================= */
.grid{display:grid;gap:10px}
.g12{grid-template-columns:repeat(12,1fr)}
.sp3{grid-column:span 3}.sp4{grid-column:span 4}.sp6{grid-column:span 6}.sp8{grid-column:span 8}.sp12{grid-column:span 12}
@media(max-width:1080px){.sp3,.sp4,.sp6,.sp8{grid-column:span 12}}
.panel{background:var(--nt-panel);border:1px solid var(--nt-border);box-shadow:var(--nt-shadow)}
.p-head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--nt-border);
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--nt-dim)}
.p-head .no{color:var(--nt-accent)}
.p-head .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400;letter-spacing:.3px}
.p-body{padding:12px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--nt-faint);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--nt-border)}

/* 统计面板（Grafana stat row × Swiss 大数） */
.stat{padding:10px 12px 9px;position:relative}
.stat .lb{font-size:10px;letter-spacing:1.6px;color:var(--nt-faint);text-transform:uppercase;padding-right:50px}
.stat .vl{font-size:25px;font-weight:300;letter-spacing:-.5px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .vl small{font-size:11px;font-weight:400;color:var(--nt-dim);letter-spacing:0}
.stat .sub{font-size:10.5px;color:var(--nt-faint);margin-top:1px;font-variant-numeric:tabular-nums}
.stat .layer{position:absolute;top:8px;right:10px;font-size:8.5px;letter-spacing:1.5px;color:var(--nt-faint)}
.stat.alert .vl{color:var(--nt-accent)}
.grp-t{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:9.5px;letter-spacing:2.5px;color:var(--nt-faint);font-weight:700}
.grp-t::after{content:'';flex:1;height:1px;background:var(--nt-border)}

/* 图表 */
.chart{position:relative}
.chart svg{display:block;width:100%}
.chart .xh{position:absolute;top:0;bottom:0;width:1px;background:var(--nt-text);opacity:.35;pointer-events:none;display:none}
.tip{position:absolute;z-index:30;background:var(--nt-panel);border:1px solid var(--nt-border2);box-shadow:2px 2px 0 rgba(0,0,0,.12);
  padding:8px 11px;font-size:11px;color:var(--nt-dim);pointer-events:none;display:none;min-width:190px;font-variant-numeric:tabular-nums}
.tip b{color:var(--nt-text);display:block;margin-bottom:3px;letter-spacing:.5px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr i{font-style:normal;color:var(--nt-faint)}
.tip .tr b{display:inline;margin:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--nt-dim);padding:8px 2px 0}
.legend .k{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;background:var(--nt-ink)}
.legend .k.red{background:var(--nt-accent)}
.legend .k.gray{background:var(--nt-gray)}
.note{margin-top:10px;padding:7px 11px;font-size:11px;color:var(--nt-faint);background:var(--nt-panel2);border-left:2px solid var(--nt-border);line-height:1.7}
.note b{color:var(--nt-dim)}

/* 表格 / 列表 */
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{font-size:9.5px;letter-spacing:1.5px;color:var(--nt-faint);text-align:left;font-weight:700;padding:5px 8px;border-bottom:1px solid var(--nt-border);text-transform:uppercase}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--nt-border);color:var(--nt-dim);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--nt-panel2);color:var(--nt-text)}
.tbl b{color:var(--nt-text);font-weight:600}
.badge{font-size:10px;padding:1px 8px;border:1px solid var(--nt-border);color:var(--nt-dim);white-space:nowrap;letter-spacing:.5px}
.badge.red{color:var(--nt-accent);border-color:var(--nt-accent)}
.badge.ok{color:var(--nt-ok);border-color:var(--nt-ok)}
.badge.solid{background:var(--nt-accent);border-color:var(--nt-accent);color:#fff}
.feed{display:flex;flex-direction:column}
.feed .row{display:flex;gap:12px;padding:7px 4px;border-bottom:1px solid var(--nt-border);font-size:12px;color:var(--nt-dim);cursor:pointer;align-items:baseline;font-variant-numeric:tabular-nums}
.feed .row:hover{background:var(--nt-panel2);color:var(--nt-text)}
.feed .row:last-child{border-bottom:none}
.feed .t{width:76px;flex:none;color:var(--nt-faint);font-size:11px}
.feed .d{flex:1;min-width:0}
.feed .delta{flex:none;font-weight:700}
.delta.up{color:var(--nt-accent)} .delta.down{color:var(--nt-ok)}

/* 假设卡 / 表单 */
.hyp{border:1px solid var(--nt-border);background:var(--nt-panel);margin-bottom:10px}
.hyp>header{display:flex;gap:10px;align-items:baseline;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.hyp>header:hover{background:var(--nt-panel2)}
.hyp .hid{font-weight:700;letter-spacing:1px}
.hyp .htx{flex:1;min-width:200px;color:var(--nt-text)}
.hyp .meta{font-size:10.5px;color:var(--nt-faint);letter-spacing:.5px}
.hyp .body{display:none;padding:4px 14px 12px;border-top:1px solid var(--nt-border)}
.hyp.open .body{display:block}
.hyp .body h4{font-size:10px;letter-spacing:2px;color:var(--nt-faint);margin:12px 0 6px;text-transform:uppercase}
.inp,textarea.inp{background:var(--nt-panel2);border:1px solid var(--nt-border);color:var(--nt-text);padding:5px 9px;font-size:12px}
.inp:focus{outline:1px solid var(--nt-border2)}
.btn{background:var(--nt-panel);border:1px solid var(--nt-border);color:var(--nt-dim);padding:5px 14px;font-size:11.5px;cursor:pointer;letter-spacing:.5px}
.btn:hover{color:var(--nt-text);border-color:var(--nt-border2)}
.btn.pri{background:var(--nt-ink);color:var(--nt-bg);border-color:var(--nt-ink);font-weight:700}
.btn.red{border-color:var(--nt-accent);color:var(--nt-accent)}
.btn.sm{padding:2px 10px;font-size:11px}
.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* 预言表 */
.prp-st{display:flex;gap:6px}
.prp-st select{background:var(--nt-panel2);border:1px solid var(--nt-border);color:var(--nt-text);padding:3px 6px;font-size:11.5px}

/* 报告页（衬线正文 —— S2 气质局部借用，仅报告页） */
.report{background:var(--nt-panel);border:1px solid var(--nt-border);padding:26px 34px}
.report .rmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 20px;
  font-size:11.5px;color:var(--nt-dim);border:1px solid var(--nt-border);padding:10px 14px;font-variant-numeric:tabular-nums}
.report .rmeta b{color:var(--nt-text)}
.report h2{font-size:17px;margin:18px 0 4px;letter-spacing:.5px}
.report h2 .no{color:var(--nt-accent);margin-right:8px}
.report .prose{font-family:Georgia,'Source Han Serif SC','Noto Serif SC','SimSun',serif;font-size:13.5px;line-height:1.95;color:var(--nt-text)}
.report .prose .zh{color:var(--nt-accent)}
.report .gate{margin-top:20px;border:1px solid var(--nt-accent);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.report .gate .gt{font-size:10px;letter-spacing:2px;color:var(--nt-accent);font-weight:700}
.gate-note{font-size:11px;color:var(--nt-faint);margin-top:8px}

/* 抽屉（Datadog Bits 式调查面板） */
#drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:var(--nt-panel);
  border-left:1px solid var(--nt-border);z-index:60;transition:right .22s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.14)}
#drawer.open{right:0}
#drawer .d-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--nt-border)}
#drawer .d-head .t{font-weight:700;letter-spacing:1px}
#drawer .d-head .x{margin-left:auto}
#drawer .d-body{flex:1;overflow:auto;padding:14px 16px}
#drawer h5{font-size:10px;letter-spacing:2px;color:var(--nt-faint);margin:16px 0 6px;text-transform:uppercase}
#scrim{position:fixed;inset:0;background:rgba(10,10,10,.32);z-index:50;display:none}
#scrim.show{display:block}

/* era 弹层 */
#eraPop{position:fixed;z-index:70;width:380px;max-width:92vw;background:var(--nt-panel);border:1px solid var(--nt-border2);
  box-shadow:4px 4px 0 rgba(0,0,0,.14);padding:14px 16px;display:none}
#eraPop.show{display:block}
#eraPop h4{margin:0 0 8px;font-size:10px;letter-spacing:2px;color:var(--nt-faint)}
#eraPop .pv{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--nt-border);font-size:11.5px;color:var(--nt-dim)}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,14px);background:var(--nt-ink);color:var(--nt-bg);
  padding:8px 20px;font-size:12px;letter-spacing:.5px;opacity:0;transition:all .25s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--nt-border);font-size:11px;color:var(--nt-faint);line-height:1.9}
.foot details summary{cursor:pointer;letter-spacing:1px}
.mono{font-family:Consolas,'Cascadia Code',monospace;font-size:11px}
.dim{color:var(--nt-dim)} .faint{color:var(--nt-faint)} .redt{color:var(--nt-accent)}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand">N·</div>
    <nav>
      <button data-nav="ov" class="on">总览</button>
      <button data-nav="crv">曲线</button>
      <button data-nav="hyp">假设</button>
      <button data-nav="prp">预言</button>
      <button data-nav="rep">报告</button>
    </nav>
    <div class="foot">S4</div>
  </aside>
  <div id="main">
    <header id="topbar">
      <div class="crumb">NAUTILUS<small>端侧 AI OPS 全链路</small><em id="viewName">总览</em></div>
      <div class="spacer"></div>
      <div class="seg" id="scopeSeg">
        <button data-scope="all">全局 · 75</button>
        <button data-scope="vault" class="on">雪谷 VAULT · 9</button>
      </div>
      <select class="ctl-select" id="rangeSel">
        <option value="1">今天</option><option value="3">3 天</option>
        <option value="7" selected>7 天</option><option value="30">30 天</option>
      </select>
      <button class="chip" id="eraChip">ERA <b id="eraTxt">API</b><span class="faint">▾</span></button>
      <button class="ctl-btn" id="themeBtn">◐ 主题</button>
    </header>
    <main id="content"><div class="wrap" id="viewRoot"></div></main>
  </div>
</div>

<aside id="drawer">
  <div class="d-head"><span class="t" id="dTitle">TURN</span><button class="btn sm x" id="dClose">关闭 ×</button></div>
  <div class="d-body" id="dBody"></div>
</aside>
<div id="scrim"></div>
<div id="eraPop">
  <h4>ERA 因果上下文 —— 判定与对照集</h4>
  <div style="font-size:12px;color:var(--nt-dim);line-height:1.8" id="eraDetail"></div>
  <div class="pv">
    <span>演示：era=local 口径预览</span>
    <button class="btn sm" id="eraDemo">切换</button>
    <span class="faint" style="font-size:10.5px">本地部署未落地，仅预览措辞分级</span>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict'
/* ================================================================
   Nautilus 工作台 · S4 瑞士制图 · 交互原型（单文件，零依赖）
   布局参照：Grafana（stat 行/统一时间范围/联动十字线）· Grafana 25193（GPU 面板行）
             Datadog Bits AI（调查抽屉/假设工作流）· nexus client（tab 挂载/问答回看）
   统计口径：2026-09-12 实弹库实测（analysis-report）；曲线/快照数值为示意数据
   ================================================================ */

// ── 工具 ──────────────────────────────────────────────────────
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
function mulberry32 (a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
const fmtK = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n))
const pct = (v) => (v * 100).toFixed(1) + '%'
const pad2 = (n) => String(n).padStart(2, '0')
const fmtT = (ts) => { const d = new Date(ts); return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) }
const fmtTTFT = (ms) => ms >= 1000 ? (ms / 1000).toFixed(2) + 's' : Math.round(ms) + 'ms'
let toastTimer = null
function toast (msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200) }

// ── 口径常量（实测来源：analysis-report 2026-09-12 · Phase 0 验证） ──────────
const SCOPES = {
  all: { name: '全局', sessions: 75, turns: 436, hit: 0.942, aProj: 0.058, cov: 65, covTotal: 436, covPct: 0.149, tpsMed: 29.2, totalIn: '924.3M', out: '4.37M', spanDays: 19, seed: 7 },
  vault: { name: '雪谷 vault', sessions: 9, turns: 34, hit: 0.938, aProj: 0.062, cov: 22, covTotal: 34, covPct: 0.647, tpsMed: 65.9, totalIn: '62.0M', out: '394K', spanDays: 16, seed: 42 },
}
const PROVIDERS = [['tokenrhythm', 331], ['opencode-go', 300], ['deepseek-official', 152]]
const TTFT_REAL = { p50: 3067, p90: 9275, min: 448, max: 32101 }
const PROPHECIES = {
  P1: '对齐离散性（S 形阈值）', P2: '宣言必要性（无种子无穿越）', P3: '防御是阻尼（Γ 窗口）',
  P4: '增益集中 L_c（τ_e 特征时间）', P5: '注入周期 T_inj < τ_d', P6: '短板定理（零响应杀死共振）',
  P7: '蒸发=重读（s_base 再激发）', P8: '静默溪流干涸（指数衰减）', P9: '注入无记录→丢失',
}
const STATUS_LABEL = { pending: '待标注', investigating: '进行中', observed: '已检验' }
const QS = ['读一下 analysis.ts 的分桶逻辑，未命中率口径对不对', '把 τ_e 检出结果整理成表', '这个爆发段是缓存预热造成的吗',
  '对照 vault 报告检查覆盖率缺口', '给出归因报告的措辞分级建议', '检查 nvidia-smi 查询字段可用性', '补一个 call_read 的迁移草案']
const AS = ['已核对 turn_read 逐轮口径：miss = token_in/(token_in+cache_read)，与报告一致；长上下文混杂需在注记标明。',
  'τ_e 按 S 形拐点邻域线性拟合，检出 4 例（详见表）；inverse-sigmoid 会话占多数，判读时注意方向。',
  '该段 cache_read 突降与首轮大 prompt 吻合，属预热混杂而非探索突增，建议不计入爆发段。',
  '覆盖缺口集中在 t3/t7/t12，均为工具调用密集轮——自评指令未触达，与 M4-B 结论一致。',
  'era=api 下仅可称「对照」；若 GPU 峰值与 TTFT 抬升同窗，措辞仍需保留弱因果限定。']

// ── 状态 ──────────────────────────────────────────────────────
const state = {
  view: 'ov', scope: 'vault', range: 7, metric: 'miss', sess: '', era: 'api',
  drawer: null,
  ann: {},

// ── 示意数据生成（确定性种子；口径对齐实测分布） ────────────────
function genTurns (scope) {
  const S = SCOPES[scope]
  const rnd = mulberry32(S.seed)
  const end = Date.now(); const start = end - S.spanDays * 86400000
  // 会话规模：少数长会话 + 多数短会话
  const sizes = []; let acc = 0
  for (let k = 0; k < S.sessions - 1; k++) { const v = 1 + Math.floor(rnd() * rnd() * 26); sizes.push(v); acc += v }
  sizes.push(Math.max(1, S.turns - acc))
  const provPool = []; PROVIDERS.forEach(([p, n], i) => { for (let k = 0; k < n; k++) provPool.push(i) })
  const turns = []; let cumBase = 20e3 + rnd() * 30e3
  const covTarget = Math.round(S.covPct * S.turns)
  const covIdx = new Set(); while (covIdx.size < covTarget) covIdx.add(Math.floor(rnd() * S.turns))
  let i = 0
  for (let si = 0; si < S.sessions; si++) {
    const size = sizes[si]
    const sStart = start + rnd() * (end - start - size * 300000)
    const shape = rnd(); const dir = shape < 0.55 ? 1 : shape < 0.8 ? -1 : 0 // 上升/反S/平
    const center = 0.25 + rnd() * 0.5; const steep = 3 + rnd() * 6
    const baseMiss = 0.03 + rnd() * 0.08
    for (let t = 0; t < size; t++, i++) {
      const frac = size < 2 ? 0.5 : t / (size - 1)
      const sig = dir === 0 ? 0 : dir * (0.34 / (1 + Math.exp(-(frac - center) * steep)) - 0.34 / (1 + Math.exp(center * steep)))
      const totalIn = (24 + frac * 38 + rnd() * 10) * 1000
      const miss = Math.min(0.34, Math.max(0.012, baseMiss + Math.max(0, sig) + (rnd() - 0.5) * 0.02))
      const spike = rnd() < 0.065
      const ttft = Math.min(TTFT_REAL.max, TTFT_REAL.min * Math.pow(TTFT_REAL.max / TTFT_REAL.min, rnd()) * (spike ? 1.5 : 1))
      const cpu = spike ? 76 + rnd() * 16 : 14 + rnd() * 14
      turns.push({
        i, si, turn: t + 1, ts: sStart + t * (240000 + rnd() * 400000),
        totalIn, miss, tps: (spike ? 0.74 : 1) * (S.tpsMed * (0.82 + rnd() * 0.36)),
        cpu, mem: 56 + Math.sin(i / 34) * 4 + rnd() * 3, gpuU: 62 + rnd() * 22, gpuM: 72 + rnd() * 10,
        temp: 56 + rnd() * 12, power: 58 + rnd() * 38, ttft, spike,
        provider: provPool[Math.floor(rnd() * provPool.length)],
        covered: covIdx.has(i),
        q: QS[Math.floor(rnd() * QS.length)], a: AS[Math.floor(rnd() * AS.length)],
      })
    }
  }
  turns.sort((a, b) => a.ts - b.ts); turns.forEach((t, k) => { t.i = k })
  return turns
}

function chartSVG (o) {

    g += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="8.5" fill="var(--nt-faint)">' + esc(o.yFmt(v)) + '</text>'

  }
  const xlab = o.xLabels || []

    g += '<line x1="' + x + '" y1="' + (h - padB) + '" x2="' + x + '" y2="' + (h - padB + 3) + '" stroke="var(--nt-border)"/>'
    g += '<text x="' + x + '" y="' + (h - 5) + '" text-anchor="middle" font-size="8.5" fill="var(--nt-faint)">' + esc(xl.txt) + '</text>'
  }
  const pts = o.pts.map((p, k) => X(k).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')
  g += '<polyline points="' + pts + '" fill="none" stroke="' + (o.color || 'var(--nt-ink)') + '" stroke-width="' + (o.lw || 1.6) + '"/>'
  for (const p of o.pts) {

    if (p.ann) g += '<circle cx="' + X(p.k) + '" cy="' + Y(p.v) + '" r="6.5" fill="none" stroke="var(--nt-accent)" stroke-width="1.1" stroke-dasharray="2 2"/>'

  g += '<line class="xh-line" x1="0" y1="' + padT + '" x2="0" y2="' + (h - padB) + '" stroke="var(--nt-text)" stroke-width="1" opacity="0"/>'

}

function bindDrawer (t) {
  const save = $('#dAnnSave')
  if (save) save.onclick = () => {
    state.ann[annKey(t)] = { tag: $('#annTag').value, note: $('#annNote').value.trim(), ts: Date.now() }
    toast('turn ' + t.turn + ' 标注已保存（' + $('#annTag').value + '）· 曲线已加红圈'); render(); openDrawer(t)
  }
  const edit = $('#dAnnEdit')
  if (edit) edit.onclick = () => { $('#dBody').innerHTML = drawerBody(t, true); bindDrawer(t) }
  const del = $('#dAnnDel')
  if (del) del.onclick = () => { delete state.ann[annKey(t)]; toast('turn ' + t.turn + ' 标注已删除'); render(); openDrawer(t) }
  $('#dNewHyp').onclick = () => { closeDrawer(); state.view = 'hyp'; render(); setTimeout(() => $('#hypNew')?.click(), 50) }
  $('#dOpenRep').onclick = () => { closeDrawer(); state.view = 'rep'; render() }
}
function openDrawer (t, edit) {
  state.drawer = t
  $('#dTitle').textContent = 'TURN ' + t.turn + ' · ' + fmtT(t.ts)
  $('#dBody').innerHTML = drawerBody(t, edit === true)
  bindDrawer(t)
  $('#drawer').classList.add('open'); $('#scrim').classList.add('show')
}
function closeDrawer () { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('show'); state.drawer = null }

  const metric = e.target.closest('[data-metric]')
  if (metric) { state.metric = metric.dataset.metric; render(); return }
  const hypt = e.target.closest('[data-hyptoggle]')
  if (hypt) { hypt.closest('.hyp').classList.toggle('open'); return }
  const hypNew = e.target.closest('#hypNew')
  if (hypNew) { const f = $('#hypForm'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; if (f.style.display === 'block') $('#hypText').focus(); return }
  const hypSave = e.target.closest('#hypSave')
  if (hypSave) {
    const txt = $('#hypText').value.trim()
    if (!txt) { toast('假设陈述不能为空'); return }
    const props = [...document.querySelectorAll('.hypP:checked')].map((c) => c.value)
    const id = 'H-' + (13 + state.hyp.length - 3)
    state.hyp.unshift({ id, text: txt, status: '验证中', props: props.length ? props : ['P4'], snaps: 0, created: '09-12', evidence: '（待取证——先查数，后回填证据链）', counter: '（待补）' })
    render(); toast(id + ' 已登记 · 关联预言 ' + (props.join('/') || 'P4')); return
  }
  const hypCancel = e.target.closest('#hypCancel')
  if (hypCancel) { $('#hypForm').style.display = 'none'; return }
  const hypok = e.target.closest('[data-hypok]')
  if (hypok) { const hy = state.hyp.find((x) => x.id === hypok.dataset.hypok); hy.status = '已归档 · 成立'; render(); toast(hy.id + ' 已归档（成立）· 预言检验表待回写'); return }
  const hypno = e.target.closest('[data-hypno]')
  if (hypno) { const hy = state.hyp.find((x) => x.id === hypno.dataset.hypno); hy.status = '已证伪'; render(); toast(hy.id + ' 已标记证伪'); return }
  const andel = e.target.closest('[data-andel]')
  if (andel) { delete state.ann[andel.dataset.andel]; render(); toast('标注已删除'); return }
  const prpSave = e.target.closest('[data-prpsave]')
  if (prpSave) {
    const k = prpSave.dataset.prpsave
    state.prp[k].status = document.querySelector('[data-prp="' + k + '"]').value
    state.prp[k].note = document.querySelector('[data-prpnote="' + k + '"]').value
    render(); toast(k + ' 标注已保存（' + STATUS_LABEL[state.prp[k].status] + '）'); return
  }
  const rep = e.target.closest('[data-rep]')
  if (rep) { toast(rep.dataset.rep === 'ok' ? 'R-012 已批准归档 · 预言检验表已回写（演示）' : 'R-012 已退回修订（演示）'); return }
})
$('#content').addEventListener('change', (e) => {
  if (e.target.id === 'sessSel') { state.sess = e.target.value; render() }
})

// ── 渲染调度 ──────────────────────────────────────────────────
const VIEWS = { ov: ['总览', renderOV], crv: ['曲线与归因', renderCRV], hyp: ['假设台账', renderHYP], prp: ['预言检验表', renderPRP], rep: ['归因报告', renderREP] }
function render () {
  document.querySelectorAll('#rail nav button').forEach((b) => b.classList.toggle('on', b.dataset.nav === state.view))
  document.querySelectorAll('#scopeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.scope === state.scope))
  $('#viewName').textContent = VIEWS[state.view][0]
  $('#eraTxt').textContent = state.era.toUpperCase()
  const root = $('#viewRoot')
  root.innerHTML = VIEWS[state.view][1]()
  if (state.view === 'ov') mountLinked(turnsInWindow(), linkedCharts(turnsInWindow()).metrics)
  const foot = document.createElement('div')
  foot.className = 'foot'
  foot.innerHTML = '<details><summary>口径与参照（Fact First）</summary>' +
    '<div style="margin-top:8px">① 统计卡为实弹库实测（analysis-report 2026-09-12：全局 436 轮/75 会话/命中率 94.2%/自评覆盖 14.9%；vault 34 轮/9 会话/93.8%/64.7%）；曲线与快照数值为示意数据，仅演示交互。<br>' +
    '② TTFT 口径 = 首块 stream 时间 − step/start 时间（turn 级取最低 step），Phase 0 实测 783 调用 100% 覆盖、p50 3.07s / p90 9.28s，双通道可回填历史。<br>' +
    '③ era 判定依据 = message.source.{provider,model}（逐调用）；本机现存 3 个云端 provider，era 机制「已定义、待 local 数据」。<br>' +
    '④ 布局参照：Grafana（stat 行 / 统一时间范围 / 联动十字线）· Grafana 看板 25193（GPU 面板行）· Datadog Bits AI（调查抽屉 / 假设工作流）· nexus client（conversation.view 挂载 / 问答回看 / 口径注记）。<br>' +
    '⑤ 主题：本页浅/暗两态即宿主亮暗主题的映射演示（--nt-* ← --dsw-alias-*）；强调朱红为静态色不随主题。<br>' +
    '⑥ 本原型为 S4「瑞士制图」<b>定版稿</b>（2026-09-12 裁定：主皮肤 + 浅/暗双主题随宿主 + nexus 层人工标注）；开发与验收规范见 <span class="mono">docs/2-dev/nautilus-dev-02-ui-workbench.md</span>（v0.1，待评审）。</div></details>'
  root.appendChild(foot)
}
// 深链：#crv,dark 等
const hash = location.hash.slice(1).split(',')
const viewMap = { ov: 1, crv: 1, hyp: 1, prp: 1, rep: 1 }
for (const tk of hash) { if (viewMap[tk]) state.view = tk; if (tk === 'dark') document.body.classList.add('dark'); if (tk === 'all') state.scope = 'all' }
render()
let rsz = null
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(render, 220) })
</script>
</body>
</html>
