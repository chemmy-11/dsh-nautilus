name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install devDeps
        run: npm ci

      - name: Build (npm-devDeps mode)
        run: npm run build

      - name: Dep compliance lint (单实例合约/预发布分支)
        run: npm run check:deps

      - name: Test (pure functions, built artifacts)
        run: npm test

      - name: Meta check (bundle + patch + exports)
        run: node .github/scripts/check-meta.mjs

      # client shim 断言（团队底座同期事故：bundle 头部缺 module shim 致浏览器加载失败）
      - name: Client shim assertion
        run: "grep -q 'var module = { exports: {} }' lib/client.js && echo 'client shim OK'"

      # prepare.mjs 对 client 构建失败仅告警（host 仍有效）——发布前显式验证产物齐全，
      # 否则 tarball 可能缺 lib/client.js 而静默发布
      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f lib/types/index.d.ts
          echo "artifacts OK"

      - name: Pack tarball
        run: |
          npm pack
          echo "TARBALL=$(ls *.tgz)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.TARBALL }}
          generate_release_notes: true
