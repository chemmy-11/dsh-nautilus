name: ci

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读仓库内容验证构建（public 仓库，写 token 无必要）
permissions:
  contents: read

# 同一 ref 的连续推送取消旧运行（避免积压浪费）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install devDeps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (npm-devDeps mode)
        run: npm run build

      - name: Test (pure functions, built artifacts)
        run: npm test

      - name: Meta check (bundle + patch + exports)
        run: node .github/scripts/check-meta.mjs

      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f lib/types/index.d.ts
          echo "artifacts OK"
