name: ci

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读仓库内容验证构建（public 仓库，写 token 无必要）
permissions:
  contents: read

# 同一 ref 的连续推送取消旧运行（避免积压浪费）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 工作流静态检查，置顶快速失败：YAML 语义 / ${{ }} 表达式 / shell 语法。
      # 注意 CI 内检查救不了「本文件解析失败」（2026-08-28 事故：plain scalar 含 'exports: '
      # 被当映射，0 jobs 静默无检查）——推送前本地跑一次 actionlint 才是这类事故的防线。
      - name: Workflow lint (actionlint)
        env:
          ACTIONLINT_VERSION: '1.7.12' # 固定版本，免 raw 脚本漂移
        run: |
          curl -sSfLo /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install devDeps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (npm-devDeps mode)
        run: npm run build

      - name: Dep compliance lint (单实例合约/预发布分支)
        run: npm run check:deps

      - name: Test (pure functions, built artifacts)
        run: npm test

      - name: Meta check (bundle + patch + exports)
        run: node .github/scripts/check-meta.mjs

      # client shim 断言（团队底座同期事故：bundle 头部缺 module shim 致浏览器加载失败）
      - name: Client shim assertion
        run: "grep -q 'var module = { exports: {} }' lib/client.js && echo 'client shim OK'"

      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f lib/types/index.d.ts
          echo "artifacts OK"
